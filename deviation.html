<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>月度偏离度预警 - 投研简报</title>
  <meta property="og:title" content="月度偏离度预警">
  <meta property="og:description" content="股票池偏离度实时监控、黄金RR指标">
  <meta property="og:type" content="website">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📈</text></svg>">
  <link rel="stylesheet" href="assets/style.css">
  <script src="https://cdn.jsdelivr.net/npm/echarts@5/dist/echarts.min.js"></script>
</head>
<body>
  <div class="container" id="app">
    <div class="loading" id="loading"><div class="spinner"></div>加载偏离度数据...</div>
  </div>

  <script src="assets/app.js"></script>
  <script>
    initPage('deviation', render);

    async function render() {
      const app = document.getElementById('app');
      const loading = document.getElementById('loading');
      const allData = await loadModuleData('deviation');
      loading.remove();

      if (allData.length === 0) {
        showEmpty(app, '偏离度预警数据将在下一个交易日自动生成');
        return;
      }

      // Flatten: each file may contain multiple runs (noon + afternoon)
      // Build flat list: [{date, time, run}]
      const flatRuns = [];
      for (const entry of allData) {
        const d = entry.data;
        const runs = d.runs || [];
        for (const run of runs) {
          flatRuns.push({ date: d.date, time: run.time, ...run });
        }
      }
      flatRuns.sort((a, b) => {
        const cmp = b.date.localeCompare(a.date);
        return cmp !== 0 ? cmp : (b.time || '').localeCompare(a.time || '');
      });

      const latestRun = flatRuns[0];
      const stocks = latestRun.stocks || [];

      // Get unique stock list (exclude stocks without valid monthly deviation data)
      // Use code as stable key — name may change on ex-dividend days (e.g. "XD三美股")
      const validStocks = stocks.filter(s => s.threshold_pct > 0 && s.trigger_price != null);
      const stockCodes = validStocks.map(s => s.code);
      const codeToName = Object.fromEntries(validStocks.map(s => [s.code, s.name]));

      // 下行通道（偏低估观察）：仅纳入下行阈值齐备的标的，按距阈值由近到远排序
      // 旧记录无 threshold_dn_pct 字段 → 该卡片整体不渲染，向后兼容
      const lowStocks = validStocks
        .filter(s => s.threshold_dn_pct != null && s.low_trigger_price != null)
        .sort((a, b) => (a.low_gap_pp == null ? 999 : a.low_gap_pp)
                      - (b.low_gap_pp == null ? 999 : b.low_gap_pp));
      const watchStocks = lowStocks.filter(s => (s.low_status || '').startsWith('watch_'));

      // Build deviation time series for charts (keyed by code for cross-day stability)
      const stockSeries = {};
      for (const code of stockCodes) {
        stockSeries[code] = { dates: [], values: [] };
      }
      for (const run of flatRuns.slice().reverse()) {
        const label = `${run.date} ${run.time || ''}`;
        for (const s of (run.stocks || [])) {
          if (stockSeries[s.code]) {
            stockSeries[s.code].dates.push(label);
            stockSeries[s.code].values.push(s.deviation_pct);
          }
        }
      }

      // Tabs for noon/afternoon
      const timeTabs = [...new Set(flatRuns.map(r => r.time))].sort();

      app.innerHTML = `
        <div class="flex items-center justify-between mb-4">
          <h1 style="font-size:24px;font-weight:700">📈 月度偏离度预警</h1>
          <div class="text-sm" style="color:var(--text-muted);text-align:right">
            <div>${latestRun.date} ${latestRun.time || ''}</div>
            ${latestRun.method ? `<div class="text-xs">口径：月K${
                latestRun.method.adjust === 'qfq' ? '前复权' : latestRun.method.adjust
              } · 回看${latestRun.method.lookback_months}月 · ${latestRun.method.source || ''}</div>` : ''}
            ${latestRun.method && latestRun.method.threshold_dn_rule ? `<div class="text-xs">上行阈值：${
                latestRun.method.threshold_rule} ｜ 下行阈值：${latestRun.method.threshold_dn_rule}</div>` : ''}
          </div>
        </div>

        <!-- Current Status Cards -->
        <div class="stats-grid">
          ${stocks.map(s => {
            const hasValidData = s.threshold_pct > 0 && s.trigger_price != null;
            // fetch_failed = 月K接口获取失败（已重试仍失败），与真实数据不足区分展示
            const fetchFailed = s.status === 'fetch_failed';
            const statusCls = !hasValidData ? 'neutral' : s.deviation_pct >= 0 ? 'up' : 'down';
            return `
              <div class="stat-card">
                <div class="stat-label">${s.name} (${s.code})</div>
                <div class="stat-value ${statusCls}">${hasValidData ? fmtPct(s.deviation_pct) : (fetchFailed ? '接口异常' : '暂无数据')}</div>
                <div class="stat-change neutral">${hasValidData ? `阈值 ${s.threshold_pct}%` : (fetchFailed ? '月K接口获取失败，待复核' : '月度数据未覆盖')}</div>
                ${s.valuation ? `
                  <div class="text-xs" style="margin-top:4px;color:var(--text-muted)">
                    估: ${s.valuation.pessimistic}/${s.valuation.neutral}/${s.valuation.optimistic}
                  </div>
                ` : ''}
              </div>
            `;
          }).join('')}
        </div>

        <!-- Deviation Chart -->
        <div class="card">
          <div class="card-title mb-4">偏离度趋势</div>
          <div id="deviationChart" class="chart-container" style="min-height:400px"></div>
        </div>

        <!-- Low Deviation Watch (three-layer filter) -->
        ${lowStocks.length ? `
        <div class="card">
          <div class="card-header">
            <div class="card-title">🟢 偏低估观察 · 抄底参考（三层过滤）</div>
            <div class="card-subtitle">纳入：距下行阈值 ≤ ${latestRun.method && latestRun.method.low_watch_gap_pp != null ? latestRun.method.low_watch_gap_pp : 12}pp ｜ 筛选器，非买入信号</div>
          </div>
          <div id="lowChannelChart" class="chart-container" style="min-height:420px"></div>
          ${watchStocks.length ? `
          <div class="table-wrap mt-4">
            <table>
              <tr>
                <th>标的</th><th>当期偏离</th><th>下行阈值</th><th>抄底参考价</th>
                <th>距阈值</th><th>5MA三月斜率</th><th>三层过滤</th>
              </tr>
              ${watchStocks.map(s => {
                const v = lowVerdict(s.low_status);
                const L = s.low_layers || {};
                const layerNote = [
                  L.slope === true ? '斜率✓' : '斜率✗',
                  L.valuation === 'pass' ? '估值✓' : (L.valuation === 'fail' ? '估值✗' : '估值—'),
                ].join(' · ');
                return `
                <tr>
                  <td class="font-bold">${s.name} (${s.code})</td>
                  <td class="${changeClass(s.deviation_pct)}">${fmtPct(s.deviation_pct)}</td>
                  <td>${s.threshold_dn_pct}%</td>
                  <td class="font-bold">${fmtPrice(s.low_trigger_price)}</td>
                  <td>${s.low_gap_pp}pp</td>
                  <td class="${changeClass(s.slope_pct)}">${s.slope_pct > 0 ? '+' : ''}${s.slope_pct}%</td>
                  <td>${v ? statusBadgeRaw(v[0], v[1]) : '—'}
                    <span class="text-xs" style="color:var(--text-muted);margin-left:6px">${layerNote}</span>
                  </td>
                </tr>`;
              }).join('')}
            </table>
          </div>
          ` : `<p class="text-sm" style="color:var(--text-muted);margin-top:12px">本次运行无标的进入观察区（三层过滤第一层未命中）。</p>`}
          <p class="text-xs" style="color:var(--text-muted);margin-top:12px">
            提醒：负偏离在趋势性下跌中会自我强化，「达到历史最深负偏离」不蕴含均值回归。抄底参考价 = 月5MA × (1 + 下行阈值)，仅为筛选器，须人工复核后决策。
          </p>
        </div>
        ` : ''}

        <!-- Gold RR Section -->
        ${latestRun.gold_rr ? `
        <div class="card">
          <div class="card-header">
            <div class="card-title">🏆 黄金 Risk Reversal (25-Delta)</div>
            <div class="card-subtitle">${latestRun.gold_rr.data_time || ''} · 现货 ${fmtPrice(latestRun.gold_rr.spot, '$')}</div>
          </div>
          <div id="rrChart" class="chart-container" style="min-height:300px"></div>
          <div class="table-wrap mt-4">
            <table>
              <tr><th>期限</th><th>RR</th><th>日变动</th><th>信号</th></tr>
              ${(latestRun.gold_rr.terms || []).map(t => `
                <tr>
                  <td class="font-bold">${t.period}</td>
                  <td class="${changeClass(t.rr)}">${t.rr > 0 ? '+' : ''}${t.rr}</td>
                  <td class="${changeClass(t.daily_change)}">${t.daily_change > 0 ? '+' : ''}${t.daily_change}</td>
                  <td>${statusBadge(getRrStatus(t.signal))}</td>
                </tr>
              `).join('')}
            </table>
          </div>
        </div>
        ` : ''}

        <!-- History -->
        <div class="card">
          <div class="card-title mb-4">历史记录</div>
          <div id="historyList"></div>
        </div>
      `;

      // Render deviation chart
      const devChart = initChart('deviationChart');
      if (devChart) {
        const theme = getEChartsTheme();
        const colors = ['#3b82f6','#22c55e','#ef4444','#eab308','#8b5cf6','#f97316','#ec4899','#06b6d4'];
        const series = stockCodes.map((code, i) => ({
          name: codeToName[code], type: 'line', smooth: true,
          data: stockSeries[code]?.values || [],
          lineStyle: { width: 2 },
          itemStyle: { color: colors[i % colors.length] }
        }));
        const allDates = [...new Set(flatRuns.slice().reverse().map(r => `${r.date} ${r.time || ''}`))];
        devChart.setOption({
          ...theme,
          tooltip: { ...theme.tooltip, trigger: 'axis' },
          legend: { ...theme.legend, data: stockCodes.map(c => codeToName[c]), type: 'scroll', bottom: 0 },
          grid: { left: 60, right: 20, top: 20, bottom: 60 },
          xAxis: { ...theme.xAxis, type: 'category', data: allDates, axisLabel: { ...theme.xAxis.axisLabel, rotate: 30 } },
          yAxis: { ...theme.yAxis, type: 'value', name: '偏离度 %' },
          series,
          dataZoom: defaultDataZoom(allDates.length)
        });
      }

      // Render low-deviation (bottom-fishing reference) channel chart
      if (lowStocks.length) {
        const lowChart = initChart('lowChannelChart');
        if (lowChart) {
          const theme = getEChartsTheme();
          lowChart.setOption({
            ...theme,
            tooltip: {
              ...theme.tooltip, trigger: 'axis', axisPointer: { type: 'shadow' },
              formatter: (params) => {
                const s = lowStocks[params[0].dataIndex];
                if (!s) return '';
                const v = lowVerdict(s.low_status);
                const rows = [
                  `<b>${s.name} (${s.code})</b>`,
                  `当期偏离：${fmtPct(s.deviation_pct)}`,
                  `下行阈值：${s.threshold_dn_pct}% ｜ 抄底参考价：${fmtPrice(s.low_trigger_price)}`,
                  `上行阈值：${s.threshold_pct}%`,
                  `距下行阈值：${s.low_gap_pp}pp`,
                ];
                if (s.slope_pct != null) {
                  rows.push(`5MA三月斜率：${s.slope_pct > 0 ? '+' : ''}${s.slope_pct}%`);
                }
                if (v) rows.push(`三层过滤：${v[0]}`);
                return rows.join('<br/>');
              }
            },
            legend: { ...theme.legend, data: ['下行阈值通道', '上行阈值通道', '当期偏离度'], bottom: 0, type: 'scroll' },
            grid: { left: 90, right: 40, top: 20, bottom: 60 },
            xAxis: { ...theme.xAxis, type: 'value', name: '偏离度 %' },
            yAxis: { ...theme.yAxis, type: 'category', data: lowStocks.map(s => s.name), inverse: true },
            series: [
              {
                // 上下行通道均用「标量值」而非浮动数组 [start, end]：实测 ECharts 5 在本场景下
                // 对首元素为 0 的浮动数组（如 [0, 43.7]）会算出 width=0 而不渲染。
                // 标量值即「0 → value」的条带，语义完全等价，且 barGap:'-100%' 三者精确重叠。
                name: '下行阈值通道', type: 'bar', barGap: '-100%', barWidth: '55%',
                data: lowStocks.map(s => s.threshold_dn_pct),
                itemStyle: { color: 'rgba(34,197,94,0.55)' }
              },
              {
                name: '上行阈值通道', type: 'bar', barGap: '-100%', barWidth: '55%',
                data: lowStocks.map(s => s.threshold_pct),
                itemStyle: { color: 'rgba(239,68,68,0.45)' }
              },
              {
                name: '当期偏离度', type: 'bar', barGap: '-100%', barWidth: 4,
                data: lowStocks.map(s => s.deviation_pct),
                itemStyle: { color: '#1e40af' },
                markLine: {
                  silent: true, symbol: 'none',
                  lineStyle: { color: '#94a3b8', width: 1 },
                  label: { show: false },
                  data: [{ xAxis: 0 }]
                }
              }
            ]
          });
        }
      }

      // Render RR chart
      if (latestRun.gold_rr) {
        const rrChart = initChart('rrChart');
        if (rrChart) {
          const theme = getEChartsTheme();
          const terms = latestRun.gold_rr.terms || [];
          rrChart.setOption({
            ...theme,
            tooltip: { ...theme.tooltip, trigger: 'axis' },
            grid: { left: 60, right: 20, top: 20, bottom: 40 },
            xAxis: { ...theme.xAxis, type: 'category', data: terms.map(t => t.period) },
            yAxis: { ...theme.yAxis, type: 'value', name: 'RR' },
            series: [{
              type: 'bar', data: terms.map(t => ({
                value: t.rr,
                itemStyle: { color: t.rr >= 0 ? '#22c55e' : '#ef4444' }
              })),
              barWidth: '40%'
            }]
          });
        }
      }

      // 口径变更边界：由旧到新逐次比较，标记口径切换的那一次运行
      // （旧记录无 method 字段 = 历史「不复权」口径；新记录带 method = 前复权+固定回看窗口）
      const methodKeyOf = r => r.method ? `${r.method.adjust}-${r.method.lookback_months}` : 'legacy';
      const methodLabelOf = r => r.method
        ? `${r.method.adjust === 'qfq' ? '前复权' : r.method.adjust}·回看${r.method.lookback_months}月`
        : '旧口径(不复权)';
      const methodChanged = new Set();
      const ascRuns = flatRuns.slice().reverse();
      for (let i = 1; i < ascRuns.length; i++) {
        if (methodKeyOf(ascRuns[i]) !== methodKeyOf(ascRuns[i - 1])) methodChanged.add(ascRuns[i]);
      }

      // Render history
      const historyEl = document.getElementById('historyList');
      historyEl.innerHTML = flatRuns.slice(0, 30).map(run => {
        // alerts: 真实预警（阈值/触发价齐备才计入）；failed: 接口异常（单独以黄色徽标提示，不计为预警）
        const alerts = (run.stocks || []).filter(s => s.status !== 'normal' && s.threshold_pct > 0 && s.trigger_price != null);
        const failed = (run.stocks || []).filter(s => s.status === 'fetch_failed');
        // lowAlerts: 进入「偏低估观察」三层过滤的标的（新口径记录才有该字段）
        const lowAlerts = (run.stocks || []).filter(s => (s.low_status || '').startsWith('watch_'));
        const badges = [
          ...alerts.map(a => `<span class="badge badge-red" style="margin-left:4px">${a.name} ${fmtPct(a.deviation_pct)}</span>`),
          ...lowAlerts.map(a => {
            const v = lowVerdict(a.low_status);
            const cls = v ? v[1] : 'badge-blue';
            return `<span class="badge ${cls}" style="margin-left:4px" title="偏低估观察 · ${v ? v[0] : ''}（距下行阈值 ${a.low_gap_pp}pp）">${a.name} 偏低估</span>`;
          }),
          ...failed.map(a => `<span class="badge badge-yellow" style="margin-left:4px" title="${a.data_note || '接口异常'}">${a.name} 接口异常</span>`),
        ].join('');
        const methodBadge = methodChanged.has(run)
          ? `<span class="badge badge-yellow" style="margin-left:4px" title="计算口径在此次运行发生变更，趋势线在该点存在口径性台阶">口径变更 → ${methodLabelOf(run)}</span>`
          : '';
        return `
          <div style="display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--border)">
            <div>
              <span class="font-bold">${run.date}</span>
              <span class="badge badge-blue" style="margin-left:8px">${run.time || ''}</span>
              ${methodBadge}
            </div>
            <div>
              ${badges || '<span class="badge badge-green">全部正常</span>'}
            </div>
          </div>
        `;
      }).join('');
    }

    function lowVerdict(status) {
      if (status === 'watch_pass') return ['三层全通过', 'badge-green'];
      if (status === 'watch_partial') return ['两层通过', 'badge-blue'];
      if (status === 'watch_reject') return ['否决', 'badge-yellow'];
      return null;
    }

    function statusBadgeRaw(label, cls) {
      return `<span class="badge ${cls}">${label}</span>`;
    }

    function getRrStatus(signal) {
      if (!signal) return 'neutral';
      const s = signal.toLowerCase();
      if (s.includes('强烈偏空')) return 'strong_bearish';
      if (s.includes('偏空')) return 'bearish';
      if (s.includes('强烈偏多')) return 'strong_bullish';
      if (s.includes('偏多')) return 'bullish';
      if (s.includes('中性偏多')) return 'neutral_bullish';
      return 'neutral';
    }
  </script>
</body>
</html>

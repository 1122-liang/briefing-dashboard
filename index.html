<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>投研简报总览</title>
  <meta property="og:title" content="投研简报总览">
  <meta property="og:description" content="A股投研数据看板 - 碳酸锂、偏离度、AIHOT、新闻研报等实时简报">
  <meta property="og:type" content="website">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📋</text></svg>">
  <link rel="stylesheet" href="assets/style.css">
  <script src="https://cdn.jsdelivr.net/npm/echarts@5/dist/echarts.min.js"></script>
</head>
<body>
  <div class="container" id="app">
    <div class="loading" id="loading"><div class="spinner"></div>加载数据中...</div>
  </div>

  <script src="assets/app.js"></script>
  <script>
    initPage('index', render);

    async function render() {
      const app = document.getElementById('app');
      const loading = document.getElementById('loading');

      // Load latest data from all modules in parallel
      const [lithium, deviation, sanmei, aihot, mcpSkills, newsReport, weeklyReview, xueqiuDigest] = await Promise.all([
        loadLatest('lithium').catch(() => null),
        loadLatest('deviation').catch(() => null),
        loadLatest('sanmei').catch(() => null),
        loadLatest('aihot').catch(() => null),
        loadLatest('mcp_skills').catch(() => null),
        loadLatest('news-report').catch(() => null),
        loadLatest('weekly-review').catch(() => null),
        loadLatest('xueqiu-digest').catch(() => null),
      ]);

      loading.remove();

      // Global data freshness check
      const allModules = [lithium, deviation, sanmei, aihot, mcpSkills, newsReport, weeklyReview, xueqiuDigest];
      const loadedCount = allModules.filter(Boolean).length;
      const totalCount = allModules.length;
      const latestGeneratedAt = allModules
        .filter(Boolean)
        .map(m => m.generated_at || m.date)
        .filter(Boolean)
        .sort()
        .reverse()[0] || null;

      const dataStatusHTML = loadedCount === 0
        ? `<div class="error-box" style="margin-bottom:16px">⚠️ 所有数据模块加载失败，请检查数据文件是否已部署</div>`
        : `<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;color:var(--text-muted);font-size:12px">
            <span>已加载 <strong>${loadedCount}/${totalCount}</strong> 个模块</span>
            ${latestGeneratedAt ? `<span>数据更新: ${fmtDateTime(latestGeneratedAt)}</span>` : ''}
          </div>`;

      // Build summary cards
      const cards = [];

      // Lithium card
      if (lithium) {
        const li = lithium.li_price || {};
        const scoreColor = (lithium.score || 0) >= 60 ? 'up' : (lithium.score || 0) <= 40 ? 'down' : 'neutral';
        cards.push(`
          <a href="lithium.html" class="stat-card">
            <div class="stat-label">🔋 碳酸锂日报</div>
            <div class="stat-value">${fmtPrice(li.close, '¥')}/吨</div>
            <div class="stat-change ${changeClass(li.change_pct)}">${fmtPct(li.change_pct)}</div>
            <div class="text-xs" style="margin-top:6px;color:var(--text-muted)">
              综合评分 <span class="font-bold ${scoreColor}">${lithium.score || '-'}</span> · ${lithium.score_level || '-'}
            </div>
          </a>
        `);
      } else {
        cards.push(`
          <a href="lithium.html" class="stat-card">
            <div class="stat-label">🔋 碳酸锂日报</div>
            <div class="empty-state" style="padding:20px"><p>暂无数据</p></div>
          </a>
        `);
      }

      // Deviation card
      if (deviation && deviation.runs && deviation.runs.length > 0) {
        const latestRun = deviation.runs[deviation.runs.length - 1];
        const stocks = latestRun.stocks || [];
        // Exclude stocks with invalid deviation data (e.g. HK stocks without monthly deviation)
        const alerts = stocks.filter(s => s.status !== 'normal' && s.threshold_pct > 0 && s.trigger_price != null).length;
        const total = stocks.length;
        cards.push(`
          <a href="deviation.html" class="stat-card">
            <div class="stat-label">📈 偏离度预警</div>
            <div class="stat-value">${total} 只</div>
            <div class="stat-change">
              ${alerts > 0
                ? `<span class="up">${alerts} 只偏高/极高</span>`
                : '<span class="down">全部正常</span>'}
            </div>
            <div class="text-xs" style="margin-top:6px;color:var(--text-muted)">
              最近更新 ${fmtDateTime(latestRun.generated_at)}
            </div>
          </a>
        `);
      } else {
        cards.push(`
          <a href="deviation.html" class="stat-card">
            <div class="stat-label">📈 偏离度预警</div>
            <div class="empty-state" style="padding:20px"><p>暂无数据</p></div>
          </a>
        `);
      }

      // Sanmei card
      if (sanmei) {
        const v = sanmei.valuation || {};
        const neutral = v.neutral || {};
        cards.push(`
          <a href="sanmei.html" class="stat-card">
            <div class="stat-label">💹 三美股份估值</div>
            <div class="stat-value">¥${neutral.target || '-'}</div>
            <div class="stat-change neutral">基准目标价 (15×PE)</div>
            <div class="text-xs" style="margin-top:6px;color:var(--text-muted)">
              现价 ¥${sanmei.stock_price || '-'} · ${sanmei.data_source || ''}
            </div>
          </a>
        `);
      } else {
        cards.push(`
          <a href="sanmei.html" class="stat-card">
            <div class="stat-label">💹 三美股份估值</div>
            <div class="empty-state" style="padding:20px"><p>暂无数据</p></div>
          </a>
        `);
      }

      // AIHOT card
      if (aihot) {
        const count = aihot.total_opportunities || 0;
        cards.push(`
          <a href="aihot.html" class="stat-card">
            <div class="stat-label">🤖 AIHOT 机会日报</div>
            <div class="stat-value">${count} 个</div>
            <div class="stat-change neutral">今日投资机会</div>
            <div class="text-xs" style="margin-top:6px;color:var(--text-muted)">
              ${aihot.no_opportunity ? '无机会' : (aihot.opportunities || []).map(o => o.industry).join(' · ')}
            </div>
          </a>
        `);
      } else {
        cards.push(`
          <a href="aihot.html" class="stat-card">
            <div class="stat-label">🤖 AIHOT 机会日报</div>
            <div class="empty-state" style="padding:20px"><p>暂无数据</p></div>
          </a>
        `);
      }

      // MCP/Skills card
      if (mcpSkills) {
        const updates = mcpSkills.updates_available || 0;
        cards.push(`
          <a href="mcp_skills.html" class="stat-card">
            <div class="stat-label">🔧 MCP/Skills</div>
            <div class="stat-value">${updates} 项</div>
            <div class="stat-change ${updates > 0 ? 'up' : 'down'}">
              ${updates > 0 ? '待更新' : '全部最新'}
            </div>
            <div class="text-xs" style="margin-top:6px;color:var(--text-muted)">
              检查日期 ${mcpSkills.date || '-'}
            </div>
          </a>
        `);
      } else {
        cards.push(`
          <a href="mcp_skills.html" class="stat-card">
            <div class="stat-label">🔧 MCP/Skills</div>
            <div class="empty-state" style="padding:20px"><p>暂无数据</p></div>
          </a>
        `);
      }

      // News/Report card
      if (newsReport) {
        const stats = newsReport.stats || {};
        const hasAlert = (stats.high_impact_count || 0) > 0 || (stats.report_changes_count || 0) > 0;
        cards.push(`
          <a href="news-report.html" class="stat-card">
            <div class="stat-label">📰 新闻研报日报</div>
            <div class="stat-value">${stats.total_news || 0} 条</div>
            <div class="stat-change ${hasAlert ? 'up' : 'neutral'}">
              重大${stats.high_impact_count || 0} · 变化${stats.report_changes_count || 0}
            </div>
            <div class="text-xs" style="margin-top:6px;color:var(--text-muted)">
              ${newsReport.date} · ${newsReport.hours}h窗口 · 研报${stats.total_reports || 0}份
            </div>
          </a>
        `);
      } else {
        cards.push(`
          <a href="news-report.html" class="stat-card">
            <div class="stat-label">📰 新闻研报日报</div>
            <div class="empty-state" style="padding:20px"><p>暂无数据</p></div>
          </a>
        `);
      }

      // Weekly Review card
      if (weeklyReview) {
        cards.push(`
          <a href="weekly-review.html" class="stat-card">
            <div class="stat-label">📋 周度复盘</div>
            <div class="stat-value">${weeklyReview.total_hours ? weeklyReview.total_hours.toFixed(1) + 'h' : '-'}</div>
            <div class="stat-change neutral">${(weeklyReview.projects || []).length} 个项目</div>
            <div class="text-xs" style="margin-top:6px;color:var(--text-muted)">
              ${weeklyReview.period || weeklyReview.date || '-'} · 产出${weeklyReview.files_created || 0}个文件
            </div>
          </a>
        `);
      } else {
        cards.push(`
          <a href="weekly-review.html" class="stat-card">
            <div class="stat-label">📋 周度复盘</div>
            <div class="empty-state" style="padding:20px"><p>每周日 20:00 自动生成</p></div>
          </a>
        `);
      }

      // Xueqiu Digest card
      if (xueqiuDigest) {
        const active = xueqiuDigest.active_users || 0;
        const filtered = xueqiuDigest.filtered_posts || 0;
        cards.push(`
          <a href="xueqiu-digest.html" class="stat-card">
            <div class="stat-label">🐦 雪球关注人动态</div>
            <div class="stat-value">${active} 人</div>
            <div class="stat-change ${filtered > 0 ? 'up' : 'down'}">${filtered} 条有效帖子</div>
            <div class="text-xs" style="margin-top:6px;color:var(--text-muted)">
              ${xueqiuDigest.date || '-'} · ${(xueqiuDigest.top_posts || []).length} 条重点
            </div>
          </a>
        `);
      } else {
        cards.push(`
          <a href="xueqiu-digest.html" class="stat-card">
            <div class="stat-label">🐦 雪球关注人动态</div>
            <div class="empty-state" style="padding:20px"><p>每天 22:30 自动生成</p></div>
          </a>
        `);
      }

      // Build timeline from all modules
      const events = [];
      if (lithium && lithium.generated_at) {
        events.push({ time: lithium.generated_at, module: '碳酸锂', icon: '🔋',
          content: `锂价 ${fmtPrice(lithium.li_price?.close)}/吨 ${fmtPct(lithium.li_price?.change_pct)}，综合评分 ${lithium.score}` });
      }
      if (deviation && deviation.runs) {
        deviation.runs.forEach(r => {
          const alerts = (r.stocks || []).filter(s => s.status !== 'normal');
          events.push({ time: r.generated_at, module: '偏离度', icon: '📈',
            content: `${r.time} 检查：${alerts.length > 0 ? alerts.length + ' 只预警' : '全部正常'}` });
        });
      }
      if (sanmei && sanmei.generated_at) {
        events.push({ time: sanmei.generated_at, module: '三美估值', icon: '💹',
          content: `数据源: ${sanmei.data_source}，加权均价 ¥${sanmei.weighted_avg_price || '-'}` });
      }
      if (aihot && aihot.generated_at) {
        events.push({ time: aihot.generated_at, module: 'AIHOT', icon: '🤖',
          content: aihot.no_opportunity ? '今日无投资机会' : `发现 ${aihot.total_opportunities} 个投资机会` });
      }
      if (mcpSkills && mcpSkills.generated_at) {
        events.push({ time: mcpSkills.generated_at, module: 'MCP/Skills', icon: '🔧',
          content: `${mcpSkills.updates_available || 0} 项待更新` });
      }
      if (newsReport && newsReport.stats) {
        const s = newsReport.stats;
        events.push({ time: newsReport.generated_at || newsReport.date, module: '新闻研报', icon: '📰',
          content: `新闻${s.total_news || 0}条(重大${s.high_impact_count || 0}) · 研报${s.total_reports || 0}份(变化${s.report_changes_count || 0})` });
      }
      if (xueqiuDigest && xueqiuDigest.date) {
        events.push({ time: xueqiuDigest.generated_at || xueqiuDigest.date, module: '雪球动态', icon: '🐦',
          content: `${xueqiuDigest.active_users || 0}人活跃 · ${xueqiuDigest.filtered_posts || 0}条有效 · ${(xueqiuDigest.top_posts || []).length}条重点` });
      }

      events.sort((a, b) => new Date(b.time) - new Date(a.time));

      const timelineHTML = events.length > 0
        ? `<div class="timeline">${events.map(e => `
            <div class="timeline-item">
              <div class="timeline-date">${fmtDateTime(e.time)}</div>
              <div class="timeline-content">
                <span class="badge badge-blue">${e.icon} ${e.module}</span>
                <span style="margin-left:8px">${e.content}</span>
              </div>
            </div>
          `).join('')}</div>`
        : '<div class="empty-state"><p>暂无最近事件</p></div>';

      app.innerHTML = `
        <h1 style="font-size:24px;font-weight:700;margin-bottom:24px">📋 投研简报总览</h1>
        ${dataStatusHTML}
        <div class="stats-grid">${cards.join('')}</div>
        <div class="card">
          <div class="card-header">
            <div class="card-title">📅 最近事件</div>
          </div>
          ${timelineHTML}
        </div>
      `;
    }
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>碳酸锂期货日报 - 投研简报</title>
  <meta property="og:title" content="碳酸锂期货日报">
  <meta property="og:description" content="碳酸锂期货价格走势、综合评分、技术指标、成本曲线">
  <meta property="og:type" content="website">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🔋</text></svg>">
  <link rel="stylesheet" href="assets/style.css">
  <script src="https://cdn.jsdelivr.net/npm/echarts@5/dist/echarts.min.js"></script>
</head>
<body>
  <div class="container" id="app">
    <div class="loading" id="loading"><div class="spinner"></div>加载碳酸锂数据...</div>
  </div>

  <script src="assets/app.js"></script>
  <script>
    initPage('lithium', render);

    async function render() {
      const app = document.getElementById('app');
      const loading = document.getElementById('loading');
      const allData = await loadModuleData('lithium');
      loading.remove();

      if (allData.length === 0) {
        showEmpty(app, '碳酸锂日报数据将在下一个交易日自动生成');
        return;
      }

      const latest = allData[0].data;
      const li = latest.li_price || {};
      const dates = allData.map(d => d.data.date).reverse();
      const prices = allData.map(d => d.data.li_price?.close).reverse();
      const scores = allData.map(d => d.data.score).reverse();

      app.innerHTML = `
        <div class="flex items-center justify-between mb-4">
          <h1 style="font-size:24px;font-weight:700">🔋 碳酸锂期货日报</h1>
          <span class="text-sm" style="color:var(--text-muted)">${latest.date} · ${li.source || ''}</span>
        </div>

        <!-- Stats -->
        <div class="stats-grid">
          <div class="stat-card">
            <div class="stat-label">碳酸锂主连</div>
            <div class="stat-value">${fmtPrice(li.close)}/吨</div>
            <div class="stat-change ${changeClass(li.change_pct)}">${fmtPct(li.change_pct)}</div>
          </div>
          <div class="stat-card">
            <div class="stat-label">综合评分</div>
            <div class="stat-value">${latest.score || '-'}</div>
            <div class="stat-change neutral">${latest.score_level || '-'}</div>
          </div>
          <div class="stat-card">
            <div class="stat-label">季节性指数</div>
            <div class="stat-value">${latest.seasonal_index || '-'}</div>
            <div class="stat-change neutral">${(latest.seasonal_index || 0) > 1 ? '旺季' : '淡季'}</div>
          </div>
        </div>

        <!-- Indicators Detail Section -->
        ${latest.indicators ? `
        <div class="card">
          <div class="card-title mb-4">📊 指标详情</div>

          <!-- 期货价格指标 -->
          ${latest.indicators.futures ? `
          <div style="margin-bottom:20px">
            <div style="font-weight:600;margin-bottom:10px;color:var(--text-primary)">期货价格</div>
            <div class="table-wrap">
              <table>
                <tr><th>指标</th><th>数值</th><th>说明</th></tr>
                <tr><td>最新价</td><td>${fmtPrice(latest.indicators.futures.latest)} 元/吨</td><td>${li.source || ''}</td></tr>
                <tr><td>涨跌幅</td><td class="${changeClass(latest.indicators.futures.change_pct)}">${fmtPct(latest.indicators.futures.change_pct)}</td><td>日涨跌</td></tr>
                <tr><td>开盘 / 最高 / 最低</td><td>${fmtPrice(latest.indicators.futures.open)} / ${fmtPrice(latest.indicators.futures.high)} / ${fmtPrice(latest.indicators.futures.low)}</td><td>日内波动</td></tr>
                ${latest.indicators.futures.volume ? `<tr><td>成交量</td><td>${fmtNum(latest.indicators.futures.volume)} 手</td><td>${latest.indicators.futures.volume_ratio ? '量比 ' + latest.indicators.futures.volume_ratio : ''}</td></tr>` : ''}
                ${latest.indicators.futures.amount_yi ? `<tr><td>成交额</td><td>${latest.indicators.futures.amount_yi} 亿元</td><td></td></tr>` : ''}
                ${latest.indicators.futures.amplitude ? `<tr><td>振幅</td><td>${latest.indicators.futures.amplitude}%</td><td>日内振幅</td></tr>` : ''}
              </table>
            </div>
          </div>
          ` : ''}

          <!-- 持仓量指标 -->
          ${latest.indicators.open_interest ? `
          <div style="margin-bottom:20px">
            <div style="font-weight:600;margin-bottom:10px;color:var(--text-primary)">持仓量</div>
            <div class="table-wrap">
              <table>
                <tr><th>指标</th><th>数值</th><th>说明</th></tr>
                ${latest.indicators.open_interest.value ? `<tr><td>持仓量</td><td>${fmtNum(latest.indicators.open_interest.value)} 手</td><td>未平仓合约总数</td></tr>` : ''}
                ${latest.indicators.open_interest.settle ? `<tr><td>结算价</td><td>${fmtPrice(latest.indicators.open_interest.settle)} 元/吨</td><td>广期所结算价</td></tr>` : ''}
              </table>
            </div>
          </div>
          ` : ''}

          <!-- 技术指标 -->
          ${latest.indicators.technical ? `
          <div style="margin-bottom:20px">
            <div style="font-weight:600;margin-bottom:10px;color:var(--text-primary)">技术指标</div>
            <div class="table-wrap">
              <table>
                <tr><th>指标</th><th>数值</th><th>信号</th></tr>
                ${latest.indicators.technical.ma20 ? `<tr><td>MA20</td><td>${fmtNum(latest.indicators.technical.ma20, 1)}</td><td>短期均线</td></tr>` : ''}
                ${latest.indicators.technical.ma60 ? `<tr><td>MA60</td><td>${fmtNum(latest.indicators.technical.ma60, 1)}</td><td>中期均线</td></tr>` : ''}
                ${latest.indicators.technical.trend ? `<tr><td>趋势判断</td><td colspan="2"><span class="badge ${latest.indicators.technical.trend.includes('偏多') ? 'badge-green' : (latest.indicators.technical.trend.includes('偏空') ? 'badge-red' : 'badge-yellow')}">${latest.indicators.technical.trend}</span></td></tr>` : ''}
                ${latest.indicators.technical.rsi ? `<tr><td>RSI(14)</td><td>${latest.indicators.technical.rsi}</td><td><span class="badge ${latest.indicators.technical.rsi > 70 ? 'badge-red' : (latest.indicators.technical.rsi < 30 ? 'badge-green' : 'badge-yellow')}">${latest.indicators.technical.rsi_signal || '中性'}</span></td></tr>` : ''}
              </table>
            </div>
          </div>
          ` : ''}

          <!-- 成本曲线参考 -->
          ${latest.indicators.cost ? `
          <div style="margin-bottom:20px">
            <div style="font-weight:600;margin-bottom:10px;color:var(--text-primary)">成本曲线参考（2026Q1）</div>
            <div class="table-wrap">
              <table>
                <tr><th>工艺路线</th><th>完全成本</th><th>状态</th></tr>
                <tr><td>盐湖提锂</td><td>${latest.indicators.cost.salt_lake} 万元/吨</td><td>当前价格下丰厚利润</td></tr>
                <tr><td>锂辉石（自有矿）</td><td>${latest.indicators.cost.spodumene} 万元/吨</td><td>当前价格下可观利润</td></tr>
                <tr><td>锂云母</td><td>${latest.indicators.cost.mica} 万元/吨</td><td>盈亏平衡边缘</td></tr>
                <tr><td>外购矿（边际）</td><td>${latest.indicators.cost.marginal} 万元/吨</td><td>高波动，即期亏损</td></tr>
              </table>
            </div>
            ${latest.indicators.cost.price_wan ? `
            <div style="margin-top:8px;font-size:13px;color:var(--text-muted)">
              当前价格 <strong>${latest.indicators.cost.price_wan} 万元/吨</strong> —
              ${latest.indicators.cost.price_wan < latest.indicators.cost.mica
                ? '🟢 低于云母成本，供给收缩信号'
                : (latest.indicators.cost.price_wan > latest.indicators.cost.marginal
                  ? '🔴 高于外购矿成本，上行空间受限'
                  : '⚪ 在成本区间内运行')}
            </div>
            ` : ''}
          </div>
          ` : ''}

          <!-- 季节性指标 -->
          ${latest.indicators.seasonal ? `
          <div style="margin-bottom:20px">
            <div style="font-weight:600;margin-bottom:10px;color:var(--text-primary)">季节性分析</div>
            <div class="table-wrap">
              <table>
                <tr><th>指标</th><th>数值</th><th>说明</th></tr>
                <tr><td>当前月份</td><td>${latest.indicators.seasonal.month} 月</td><td></td></tr>
                <tr><td>季节性指数</td><td>${latest.indicators.seasonal.index}</td><td><span class="badge ${latest.indicators.seasonal.phase === '旺季' ? 'badge-green' : (latest.indicators.seasonal.phase === '淡季' ? 'badge-red' : 'badge-yellow')}">${latest.indicators.seasonal.phase}</span></td></tr>
              </table>
            </div>
            <div style="margin-top:8px;font-size:13px;color:var(--text-muted)">
              ${latest.indicators.seasonal.phase === '旺季' ? '📈 传统旺季，价格易涨难跌' : (latest.indicators.seasonal.phase === '淡季' ? '📉 传统淡季，价格承压' : '➡️ 季节性中性')}
            </div>
          </div>
          ` : ''}

          <!-- 地缘风险 -->
          ${latest.indicators.geo_risks && latest.indicators.geo_risks.length > 0 ? `
          <div style="margin-bottom:20px">
            <div style="font-weight:600;margin-bottom:10px;color:var(--text-primary)">地缘政治风险</div>
            ${latest.indicators.geo_risks.map(r => `
              <div style="display:flex;align-items:center;gap:12px;padding:8px 0;border-bottom:1px solid var(--border)">
                <span class="badge ${r.score >= 6 ? 'badge-red' : r.score >= 4 ? 'badge-yellow' : 'badge-green'}">${r.score}分</span>
                <span class="font-bold">${r.name}</span>
                <span class="text-sm" style="color:var(--text-muted)">${r.status}</span>
              </div>
            `).join('')}
          </div>
          ` : ''}
        </div>
        ` : ''}

        <!-- Price Chart -->
        <div class="card">
          <div class="card-title mb-4">碳酸锂价格走势</div>
          <div id="priceChart" class="chart-container"></div>
        </div>

        <!-- Price + Warehouse Chart -->
        <div class="card">
          <div class="card-title mb-4">📈 价格与仓单变动</div>
          <div id="priceWarehouseChart" class="chart-container" style="min-height:350px"></div>
        </div>

        <!-- Score Gauge -->
        <div class="card">
          <div class="card-title mb-4">综合评分</div>
          <div id="scoreChart" class="chart-container" style="min-height:250px"></div>
        </div>

        <!-- Score Details Table -->
        ${latest.score_details && latest.score_details.length > 0 ? `
        <div class="card">
          <div class="card-title mb-4">评分明细</div>
          <div class="table-wrap">
            <table>
              <tr><th>维度</th><th>分值</th><th>说明</th></tr>
              ${latest.score_details.map(d => `
                <tr>
                  <td class="font-bold">${d.dimension}</td>
                  <td><span class="badge ${d.score.includes('+') ? 'badge-green' : (d.score.includes('-') ? 'badge-red' : 'badge-yellow')}">${d.score}</span></td>
                  <td>${d.note}</td>
                </tr>
              `).join('')}
            </table>
          </div>
        </div>
        ` : ''}

        <!-- Geo Risks (top-level, fallback if not in indicators) -->
        ${!latest.indicators?.geo_risks?.length && latest.geo_risks && latest.geo_risks.length > 0 ? `
        <div class="card">
          <div class="card-title mb-4">地缘政治风险</div>
          ${latest.geo_risks.map(r => `
            <div style="display:flex;align-items:center;gap:12px;padding:8px 0;border-bottom:1px solid var(--border)">
              <span class="badge ${r.score >= 6 ? 'badge-red' : r.score >= 4 ? 'badge-yellow' : 'badge-green'}">${r.score}分</span>
              <span class="font-bold">${r.name}</span>
              <span class="text-sm" style="color:var(--text-muted)">${r.status}</span>
            </div>
          `).join('')}
        </div>
        ` : ''}

        <!-- History List -->
        <div class="card">
          <div class="card-title mb-4">历史日报</div>
          <div id="historyList"></div>
        </div>
      `;

      // Render price chart
      const priceChart = initChart('priceChart');
      if (priceChart) {
        const theme = getEChartsTheme();
        priceChart.setOption({
          ...theme,
          tooltip: { ...theme.tooltip, trigger: 'axis' },
          grid: { left: 60, right: 20, top: 30, bottom: 50 },
          xAxis: { ...theme.xAxis, type: 'category', data: dates },
          yAxis: {
            ...theme.yAxis, type: 'value',
            name: '元/吨',
            axisLabel: { ...theme.yAxis.axisLabel, formatter: v => (v/10000).toFixed(1) + '万' }
          },
          series: [{
            type: 'line', data: prices, smooth: true,
            lineStyle: { color: '#3b82f6', width: 2 },
            areaStyle: { color: new echarts.graphic.LinearGradient(0, 0, 0, 1, [
              { offset: 0, color: 'rgba(59,130,246,0.3)' },
              { offset: 1, color: 'rgba(59,130,246,0.02)' }
            ])},
            itemStyle: { color: '#3b82f6' }
          }],
          dataZoom: defaultDataZoom(allData.length)
        });
      }

      // Render price + warehouse chart (dual axis)
      const whDates = allData.map(d => d.data.date).reverse();
      const whPrices = allData.map(d => d.data.li_price?.close).reverse();
      const whWarehouseTotal = allData.map(d => d.data.warehouse_data?.total || null).reverse();
      const whWarehouseChange = allData.map(d => d.data.warehouse_data?.change || null).reverse();

      const hasWarehouseData = whWarehouseTotal.some(v => v !== null);
      const priceWarehouseChart = initChart('priceWarehouseChart');
      if (priceWarehouseChart) {
        const theme = getEChartsTheme();
        const series = [
          {
            name: '碳酸锂价格',
            type: 'line',
            yAxisIndex: 0,
            data: whPrices,
            smooth: true,
            lineStyle: { color: '#3b82f6', width: 2 },
            itemStyle: { color: '#3b82f6' },
            symbol: 'circle',
            symbolSize: 6,
          }
        ];

        if (hasWarehouseData) {
          series.push({
            name: '仓单总量',
            type: 'line',
            yAxisIndex: 1,
            data: whWarehouseTotal,
            smooth: true,
            lineStyle: { color: '#f59e0b', width: 2, type: 'solid' },
            itemStyle: { color: '#f59e0b' },
            symbol: 'diamond',
            symbolSize: 7,
            areaStyle: {
              color: new echarts.graphic.LinearGradient(0, 0, 0, 1, [
                { offset: 0, color: 'rgba(245,158,11,0.2)' },
                { offset: 1, color: 'rgba(245,158,11,0.02)' }
              ])
            },
          });
          series.push({
            name: '仓单日变化',
            type: 'bar',
            yAxisIndex: 2,
            data: whWarehouseChange.map(v => ({
              value: v,
              itemStyle: {
                color: v > 0 ? '#22c55e' : (v < 0 ? '#ef4444' : '#64748b'),
                borderRadius: [3, 3, 0, 0],
              }
            })),
            barMaxWidth: 20,
          });
        }

        priceWarehouseChart.setOption({
          ...theme,
          tooltip: {
            ...theme.tooltip,
            trigger: 'axis',
            axisPointer: { type: 'cross' },
          },
          legend: {
            ...theme.textStyle,
            data: hasWarehouseData
              ? ['碳酸锂价格', '仓单总量', '仓单日变化']
              : ['碳酸锂价格'],
            top: 0,
            right: 0,
          },
          grid: { left: 60, right: hasWarehouseData ? 80 : 20, top: 40, bottom: 50 },
          xAxis: { ...theme.xAxis, type: 'category', data: whDates },
          yAxis: [
            {
              ...theme.yAxis, type: 'value',
              name: '价格（元/吨）',
              position: 'left',
              axisLabel: { ...theme.yAxis.axisLabel, formatter: v => (v/10000).toFixed(1) + '万' },
            },
            ...(hasWarehouseData ? [
              {
                ...theme.yAxis, type: 'value',
                name: '仓单总量（手）',
                position: 'right',
                splitLine: { show: false },
                axisLabel: { ...theme.yAxis.axisLabel, formatter: v => (v/10000).toFixed(1) + '万' },
              },
              {
                ...theme.yAxis, type: 'value',
                name: '日变化（手）',
                position: 'right',
                offset: 50,
                splitLine: { show: false },
                axisLabel: { ...theme.yAxis.axisLabel },
              }
            ] : [])
          ],
          series,
          dataZoom: defaultDataZoom(allData.length),
        });

        // Show hint if no warehouse data
        if (!hasWarehouseData) {
          const el = document.getElementById('priceWarehouseChart');
          const hint = document.createElement('div');
          hint.style.cssText = 'text-align:center;color:#64748b;font-size:13px;margin-top:8px;';
          hint.textContent = '💡 仓单数据需通过 --warehouse-total / --warehouse-change 参数手动输入';
          el.parentNode.appendChild(hint);
        }
      }

      // Render score gauge
      const scoreChart = initChart('scoreChart');
      if (scoreChart) {
        scoreChart.setOption({
          series: [{
            type: 'gauge',
            min: 0, max: 100,
            progress: { show: true, width: 18 },
            axisLine: { lineStyle: { width: 18, color: [[0.3, '#22c55e'], [0.7, '#eab308'], [1, '#ef4444']] } },
            axisTick: { show: false },
            splitLine: { length: 10, lineStyle: { width: 2, color: '#64748b' } },
            axisLabel: { distance: 25, color: '#94a3b8', fontSize: 12 },
            pointer: { itemStyle: { color: '#3b82f6' } },
            title: { offsetCenter: [0, '70%'], fontSize: 14, color: '#94a3b8' },
            detail: { valueAnimation: true, fontSize: 32, color: '#f1f5f9', offsetCenter: [0, '40%'], formatter: '{value}' },
            data: [{ value: latest.score || 0, name: latest.score_level || '' }]
          }]
        });
      }

      // Render history list
      const historyEl = document.getElementById('historyList');
      historyEl.innerHTML = allData.map(d => {
        const data = d.data;
        const li2 = data.li_price || {};
        return `
          <div style="display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--border)">
            <div>
              <span class="font-bold">${data.date}</span>
              <span class="text-xs" style="color:var(--text-muted);margin-left:8px">评分 ${data.score || '-'}</span>
            </div>
            <div>
              <span>${fmtPrice(li2.close)}/吨</span>
              <span class="${changeClass(li2.change_pct)}" style="margin-left:8px">${fmtPct(li2.change_pct)}</span>
            </div>
          </div>
        `;
      }).join('');
    }
  </script>
</body>
</html>

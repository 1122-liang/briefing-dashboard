<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MCP & Skills 月度检查</title>
  <link rel="stylesheet" href="assets/style.css">
</head>
<body>
  <div class="container" id="app">
    <div class="loading" id="loading"><div class="spinner"></div>加载 MCP/Skills 数据...</div>
  </div>

  <script src="assets/app.js"></script>
  <script>
    initPage('mcp_skills', render);

    async function render() {
      const app = document.getElementById('app');
      const loading = document.getElementById('loading');
      const allData = await loadModuleData('mcp_skills');
      loading.remove();

      if (allData.length === 0) {
        showEmpty(app, 'MCP/Skills 月度检查数据将在每月 1 日自动生成');
        return;
      }

      const latest = allData[0].data;

      function statusIcon(status) {
        if (status === 'up_to_date') return '✅';
        if (status === 'needs_update') return '🟡';
        return '❓';
      }

      function statusLabel(status) {
        if (status === 'up_to_date') return '最新';
        if (status === 'needs_update') return '需更新';
        return status || '-';
      }

      app.innerHTML = `
        <div class="flex items-center justify-between mb-4">
          <h1 style="font-size:24px;font-weight:700">🔧 MCP & Skills 月度检查</h1>
          <span class="text-sm" style="color:var(--text-muted)">${latest.date}</span>
        </div>

        <!-- Stats -->
        <div class="stats-grid">
          <div class="stat-card">
            <div class="stat-label">待更新</div>
            <div class="stat-value ${(latest.updates_available || 0) > 0 ? 'up' : 'down'}">${latest.updates_available || 0}</div>
            <div class="stat-change neutral">${(latest.updates_available || 0) > 0 ? '项需要更新' : '全部最新'}</div>
          </div>
          <div class="stat-card">
            <div class="stat-label">MCP 服务</div>
            <div class="stat-value">${(latest.mcp_services || []).length}</div>
            <div class="stat-change neutral">已安装</div>
          </div>
          <div class="stat-card">
            <div class="stat-label">Skills</div>
            <div class="stat-value">${(latest.skills || []).length}</div>
            <div class="stat-change neutral">已安装</div>
          </div>
          <div class="stat-card">
            <div class="stat-label">Python 包</div>
            <div class="stat-value">${(latest.python_packages || []).length}</div>
            <div class="stat-change neutral">已检查</div>
          </div>
        </div>

        <!-- MCP Services -->
        <div class="card">
          <div class="card-title mb-4">MCP 服务</div>
          ${(latest.mcp_services || []).length === 0
            ? '<div class="empty-state"><p>暂无 MCP 服务数据</p></div>'
            : `<div class="table-wrap">
                <table>
                  <tr><th>服务</th><th>当前版本</th><th>最新版本</th><th>状态</th></tr>
                  ${(latest.mcp_services || []).map(s => `
                    <tr>
                      <td class="font-bold">${s.name}</td>
                      <td class="font-mono">${s.current_version || '-'}</td>
                      <td class="font-mono">${s.latest_version || '-'}</td>
                      <td>${statusIcon(s.status)} ${statusLabel(s.status)}</td>
                    </tr>
                  `).join('')}
                </table>
              </div>`}
        </div>

        <!-- Skills -->
        <div class="card">
          <div class="card-title mb-4">Skills</div>
          ${(latest.skills || []).length === 0
            ? '<div class="empty-state"><p>暂无 Skills 数据</p></div>'
            : `<div class="table-wrap">
                <table>
                  <tr><th>Skill</th><th>当前版本</th><th>最新版本</th><th>状态</th></tr>
                  ${(latest.skills || []).map(s => `
                    <tr>
                      <td class="font-bold">${s.name}</td>
                      <td class="font-mono">${s.current_version || '-'}</td>
                      <td class="font-mono">${s.latest_version || '-'}</td>
                      <td>${statusIcon(s.status)} ${statusLabel(s.status)}</td>
                    </tr>
                  `).join('')}
                </table>
              </div>`}
        </div>

        <!-- Python Packages -->
        <div class="card">
          <div class="card-title mb-4">Python 包</div>
          ${(latest.python_packages || []).length === 0
            ? '<div class="empty-state"><p>暂无 Python 包数据</p></div>'
            : `<div class="table-wrap">
                <table>
                  <tr><th>包名</th><th>当前版本</th><th>最新版本</th><th>状态</th></tr>
                  ${(latest.python_packages || []).map(s => `
                    <tr>
                      <td class="font-bold">${s.name}</td>
                      <td class="font-mono">${s.current_version || '-'}</td>
                      <td class="font-mono">${s.latest_version || '-'}</td>
                      <td>${statusIcon(s.status)} ${statusLabel(s.status)}</td>
                    </tr>
                  `).join('')}
                </table>
              </div>`}
        </div>

        <!-- History -->
        ${allData.length > 1 ? `
        <div class="card">
          <div class="card-title mb-4">历史检查</div>
          ${allData.map(entry => {
            const d = entry.data;
            return `
              <div style="display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--border)">
                <div>
                  <span class="font-bold">${d.date}</span>
                </div>
                <div>
                  ${(d.updates_available || 0) > 0
                    ? `<span class="badge badge-yellow">${d.updates_available} 项待更新</span>`
                    : '<span class="badge badge-green">全部最新</span>'}
                </div>
              </div>
            `;
          }).join('')}
        </div>
        ` : ''}
      `;
    }
  </script>
</body>
</html>

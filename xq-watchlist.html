<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>南京路彼岸 自选股监控</title>
<style>
:root {
  --bg: #f8f9fa;
  --card-bg: #fff;
  --border: #e8e8e8;
  --text: #1a1a1a;
  --text-secondary: #666;
  --red: #c0392b;
  --green: #27ae60;
  --blue: #2980b9;
  --tag-add-bg: #fde8e8;
  --tag-add-text: #c0392b;
  --tag-remove-bg: #e8f5e9;
  --tag-remove-text: #27ae60;
  --hover: #f5f5f5;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
    "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
  background: var(--bg);
  color: var(--text);
  line-height: 1.6;
}
.container {
  max-width: 1200px;
  margin: 0 auto;
  padding: 20px;
}
.header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 24px;
  padding-bottom: 16px;
  border-bottom: 2px solid var(--border);
}
.header h1 {
  font-size: 22px;
  font-weight: 600;
}
.header .meta {
  font-size: 13px;
  color: var(--text-secondary);
  text-align: right;
}
.header .meta .count {
  font-size: 28px;
  font-weight: 700;
  color: var(--blue);
  display: block;
}
.grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 20px;
}
@media (max-width: 768px) {
  .grid { grid-template-columns: 1fr; }
}
.card {
  background: var(--card-bg);
  border-radius: 10px;
  border: 1px solid var(--border);
  overflow: hidden;
}
.card-header {
  padding: 14px 18px;
  font-size: 15px;
  font-weight: 600;
  border-bottom: 1px solid var(--border);
  background: #fafafa;
  display: flex;
  justify-content: space-between;
  align-items: center;
}
.card-body {
  padding: 0;
}

/* 当前列表 */
.stock-list { list-style: none; }
.stock-item {
  display: flex;
  align-items: center;
  padding: 12px 18px;
  border-bottom: 1px solid #f0f0f0;
  transition: background 0.15s;
}
.stock-item:last-child { border-bottom: none; }
.stock-item:hover { background: var(--hover); }
.stock-name {
  font-weight: 500;
  font-size: 15px;
  min-width: 100px;
}
.stock-code {
  font-size: 13px;
  color: var(--text-secondary);
  margin-left: 8px;
  font-family: "SF Mono", "Menlo", monospace;
}
.stock-market {
  font-size: 11px;
  padding: 1px 6px;
  border-radius: 3px;
  margin-left: 8px;
  background: #eee;
  color: var(--text-secondary);
}
.stock-time {
  margin-left: auto;
  font-size: 12px;
  color: var(--text-secondary);
}

/* 变动时间线 */
.timeline { list-style: none; }
.timeline-date {
  border-bottom: 1px solid #f0f0f0;
}
.timeline-date:last-child { border-bottom: none; }
.timeline-date-header {
  display: flex;
  align-items: center;
  padding: 12px 18px;
  cursor: pointer;
  transition: background 0.15s;
  user-select: none;
}
.timeline-date-header:hover { background: var(--hover); }
.timeline-date-header .arrow {
  font-size: 12px;
  margin-right: 8px;
  transition: transform 0.2s;
  color: var(--text-secondary);
}
.timeline-date-header .arrow.open { transform: rotate(90deg); }
.timeline-date-header .date-text {
  font-weight: 500;
  font-size: 14px;
}
.timeline-date-header .date-summary {
  margin-left: auto;
  font-size: 13px;
  color: var(--text-secondary);
}
.timeline-date-header .add-count {
  color: var(--red);
  font-weight: 500;
}
.timeline-date-header .remove-count {
  color: var(--green);
  font-weight: 500;
}
.timeline-changes {
  display: none;
  padding: 0 18px 12px 38px;
}
.timeline-changes.open { display: block; }
.change-item {
  display: flex;
  align-items: center;
  padding: 6px 0;
  font-size: 13px;
  border-bottom: 1px dashed #f5f5f5;
}
.change-item:last-child { border-bottom: none; }
.change-time {
  font-family: "SF Mono", "Menlo", monospace;
  color: var(--text-secondary);
  min-width: 50px;
}
.change-tag {
  display: inline-block;
  padding: 1px 8px;
  border-radius: 3px;
  font-size: 12px;
  font-weight: 500;
  margin: 0 8px;
  min-width: 36px;
  text-align: center;
}
.change-tag.add {
  background: var(--tag-add-bg);
  color: var(--tag-add-text);
}
.change-tag.remove {
  background: var(--tag-remove-bg);
  color: var(--tag-remove-text);
}
.change-name { font-weight: 500; }
.change-code {
  font-size: 12px;
  color: var(--text-secondary);
  margin-left: 6px;
  font-family: "SF Mono", "Menlo", monospace;
}

/* 状态指示 */
.status-bar {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 12px;
  color: var(--text-secondary);
  margin-top: 16px;
  justify-content: center;
}
.status-dot {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: var(--green);
}
.status-dot.error { background: var(--red); }
.status-dot.stale { background: #f39c12; }

.empty-hint {
  padding: 40px 18px;
  text-align: center;
  color: var(--text-secondary);
  font-size: 14px;
}
</style>
</head>
<body>

<div class="container">
  <div class="header">
    <h1>📌 南京路彼岸 自选股监控</h1>
    <div class="meta">
      <span class="count" id="stockCount">-</span>
      自选股数量
      <div>最后更新: <span id="updatedAt">-</span></div>
    </div>
  </div>

  <div class="grid">
    <div class="card">
      <div class="card-header">
        📋 当前自选股
        <span id="listBadge" style="font-size:12px;color:var(--text-secondary)"></span>
      </div>
      <div class="card-body">
        <ul class="stock-list" id="stockList">
          <li class="empty-hint">加载中...</li>
        </ul>
      </div>
    </div>

    <div class="card">
      <div class="card-header">
        📅 变动时间线
        <span id="changeBadge" style="font-size:12px;color:var(--text-secondary)"></span>
      </div>
      <div class="card-body">
        <ul class="timeline" id="timeline">
          <li class="empty-hint">暂无变动记录</li>
        </ul>
      </div>
    </div>
  </div>

  <div class="status-bar">
    <span class="status-dot" id="statusDot"></span>
    <span id="statusText">等待数据...</span>
  </div>
</div>

<script src="xq-watchlist-data.js"></script>
<script>
// ============================================================
// Data loading - supports both embedded and fetch modes
// ============================================================

let snapshotData = null;
let changelogData = null;

function getBaseUrl() {
  // Determine base path for JSON files relative to this HTML
  const scripts = document.getElementsByTagName('script');
  const lastScript = scripts[scripts.length - 1];
  const src = lastScript ? lastScript.src : '';
  if (src) {
    return src.replace(/\/[^\/]*$/, '/');
  }
  // Fallback: same directory
  const loc = window.location.href;
  return loc.replace(/\/[^\/]*$/, '/');
}

async function loadJSON(filename) {
  // Try embedded data first
  if (window['__SNAPSHOT__'] && filename.includes('latest')) {
    return window['__SNAPSHOT__'];
  }
  if (window['__CHANGELOG__'] && filename.includes('changelog')) {
    return window['__CHANGELOG__'];
  }
  // Try fetch (works with HTTP server)
  try {
    const base = getBaseUrl();
    // Try data subdirectory first, then same directory
    for (const prefix of ['data/xq-watchlist/', '']) {
      try {
        const resp = await fetch(base + prefix + filename, { cache: 'no-store' });
        if (resp.ok) return await resp.json();
      } catch (e) { /* try next */ }
    }
  } catch (e) { /* fetch failed */ }
  return null;
}

// ============================================================
// Rendering
// ============================================================

function renderStockList(stocks) {
  const el = document.getElementById('stockList');
  if (!stocks || stocks.length === 0) {
    el.innerHTML = '<li class="empty-hint">暂无数据</li>';
    return;
  }
  el.innerHTML = stocks.map(s => {
    const watchedTime = s.watched ? formatWatchedTime(s.watched) : '';
    return `
      <li class="stock-item">
        <span class="stock-name">${esc(s.name)}</span>
        <span class="stock-code">${esc(s.symbol)}</span>
        <span class="stock-market">${esc(s.marketplace)}</span>
        ${watchedTime ? `<span class="stock-time">加入: ${watchedTime}</span>` : ''}
      </li>`;
  }).join('');
}

function renderTimeline(changelog) {
  const el = document.getElementById('timeline');
  if (!changelog || changelog.length === 0) {
    el.innerHTML = '<li class="empty-hint">暂无变动记录，监控运行后自动记录</li>';
    document.getElementById('changeBadge').textContent = '';
    return;
  }

  let totalChanges = 0;
  el.innerHTML = changelog.map((day, idx) => {
    const adds = day.changes.filter(c => c.action === 'add');
    const removes = day.changes.filter(c => c.action === 'remove');
    totalChanges += day.changes.length;
    const isOpen = idx === 0; // Today open by default
    const weekday = getWeekday(day.date);

    const changesHtml = day.changes
      .sort((a, b) => b.time.localeCompare(a.time))
      .map(c => {
        const isAdd = c.action === 'add';
        return `
          <div class="change-item">
            <span class="change-time">${esc(c.time)}</span>
            <span class="change-tag ${isAdd ? 'add' : 'remove'}">${isAdd ? '➕' : '➖'}</span>
            <span class="change-name">${esc(c.name)}</span>
            <span class="change-code">${esc(c.symbol)}</span>
          </div>`;
      }).join('');

    return `
      <li class="timeline-date">
        <div class="timeline-date-header" onclick="toggleDate(this)">
          <span class="arrow ${isOpen ? 'open' : ''}">▶</span>
          <span class="date-text">${esc(day.date)} (${weekday})</span>
          <span class="date-summary">
            ${adds.length > 0 ? `<span class="add-count">+${adds.length}</span>` : ''}
            ${adds.length > 0 && removes.length > 0 ? ' / ' : ''}
            ${removes.length > 0 ? `<span class="remove-count">-${removes.length}</span>` : ''}
          </span>
        </div>
        <div class="timeline-changes ${isOpen ? 'open' : ''}">
          ${changesHtml}
        </div>
      </li>`;
  }).join('');

  document.getElementById('changeBadge').textContent = `共 ${changelog.length} 天 / ${totalChanges} 条变动`;
}

function toggleDate(header) {
  const arrow = header.querySelector('.arrow');
  const changes = header.nextElementSibling;
  arrow.classList.toggle('open');
  changes.classList.toggle('open');
}

function updateMeta(snapshot) {
  if (!snapshot) return;
  document.getElementById('stockCount').textContent = snapshot.count || '-';
  document.getElementById('updatedAt').textContent = snapshot.updated_at || '-';
  document.getElementById('listBadge').textContent = `共 ${snapshot.count} 只`;
}

function updateStatus(ok, text) {
  const dot = document.getElementById('statusDot');
  const txt = document.getElementById('statusText');
  dot.className = 'status-dot' + (ok ? '' : ' error');
  txt.textContent = text;
}

// ============================================================
// Helpers
// ============================================================

function esc(s) {
  if (!s) return '';
  const d = document.createElement('div');
  d.textContent = s;
  return d.innerHTML;
}

function formatWatchedTime(isoStr) {
  try {
    const d = new Date(isoStr);
    const MM = String(d.getMonth() + 1).padStart(2, '0');
    const DD = String(d.getDate()).padStart(2, '0');
    const hh = String(d.getHours()).padStart(2, '0');
    const mm = String(d.getMinutes()).padStart(2, '0');
    return `${MM}-${DD} ${hh}:${mm}`;
  } catch {
    return isoStr;
  }
}

function getWeekday(dateStr) {
  try {
    const d = new Date(dateStr + 'T00:00:00');
    const days = ['周日', '周一', '周二', '周三', '周四', '周五', '周六'];
    return days[d.getDay()];
  } catch {
    return '';
  }
}

// ============================================================
// Main
// ============================================================

async function refresh() {
  try {
    const [snapshot, changelog] = await Promise.all([
      loadJSON('latest.json'),
      loadJSON('changelog.json'),
    ]);

    if (snapshot) {
      snapshotData = snapshot;
      renderStockList(snapshot.stocks);
      updateMeta(snapshot);
    }

    if (changelog) {
      changelogData = changelog;
      renderTimeline(changelog);
    }

    const now = new Date().toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit' });
    updateStatus(true, `已加载 | 自动刷新每 60 秒 | ${now}`);
  } catch (e) {
    updateStatus(false, `加载失败: ${e.message}`);
  }
}

// Initial load
refresh();
// Auto refresh every 60 seconds
setInterval(refresh, 60000);
</script>
</body>
</html>

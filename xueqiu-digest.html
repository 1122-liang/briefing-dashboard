<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>雪球关注人动态摘要 - 投研简报</title>
  <meta property="og:title" content="雪球关注人动态摘要">
  <meta property="og:description" content="107位关注人每日动态、重点消息、AI分析摘要">
  <meta property="og:type" content="website">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🐦</text></svg>">
  <link rel="stylesheet" href="assets/style.css">
  <script src="https://cdn.jsdelivr.net/npm/echarts@5/dist/echarts.min.js"></script>
</head>
<body>
  <div class="container" id="app">
    <div class="loading" id="loading"><div class="spinner"></div>加载雪球动态数据...</div>
  </div>

  <script src="assets/app.js"></script>
  <script>
    initPage('xueqiu-digest', render);

    async function render() {
      const app = document.getElementById('app');
      const loading = document.getElementById('loading');
      const allData = await loadModuleData('xueqiu-digest');
      loading.remove();

      if (allData.length === 0) {
        showEmpty(app, '雪球关注人动态摘要将在每天 22:30 自动生成');
        return;
      }

      const latest = allData[0].data;

      // Summary stats
      const totalFollowing = latest.total_following || latest.total_users || 0;
      const activeUsers = latest.active_users || 0;
      const totalPosts = latest.total_posts || 0;
      const filteredPosts = latest.filtered_posts || 0;
      const topPosts = latest.top_posts || [];
      const categories = latest.categories || {};
      const todayTopics = latest.today_topics || [];
      const todayTopicsCount = latest.today_topics_count || todayTopics.length;

      // Category breakdown for chart
      const catEntries = Object.entries(categories).filter(([k, v]) => v > 0);

      app.innerHTML = `
        <div class="flex items-center justify-between mb-4">
          <h1 style="font-size:24px;font-weight:700">🐦 雪球关注人每日动态</h1>
          <span class="text-sm" style="color:var(--text-muted)">${latest.date || '-'}</span>
        </div>

        <!-- Stats -->
        <div class="stats-grid">
          <div class="stat-card">
            <div class="stat-label">总关注人数</div>
            <div class="stat-value">${totalFollowing}</div>
            <div class="stat-change neutral">今日活跃 ${activeUsers} 人</div>
          </div>
          <div class="stat-card">
            <div class="stat-label">原始帖子</div>
            <div class="stat-value">${totalPosts}</div>
            <div class="stat-change neutral">过滤前总数</div>
          </div>
          <div class="stat-card">
            <div class="stat-label">有效帖子</div>
            <div class="stat-value">${filteredPosts}</div>
            <div class="stat-change ${filteredPosts > 0 ? 'up' : 'down'}">${filteredPosts > 0 ? '投资相关内容' : '无有效内容'}</div>
          </div>
          <div class="stat-card">
            <div class="stat-label">今日话题</div>
            <div class="stat-value">${todayTopicsCount}</div>
            <div class="stat-change ${todayTopicsCount > 0 ? 'up' : 'down'}">${todayTopicsCount > 0 ? '篇热门文章' : '暂无数据'}</div>
          </div>
        </div>

        <!-- Category Distribution -->
        ${catEntries.length > 0 ? `
        <div class="card">
          <div class="card-title mb-4">话题分布</div>
          <div id="categoryChart" class="chart-container" style="min-height:280px"></div>
        </div>
        ` : ''}

        <!-- Today Topics -->
        ${todayTopics.length > 0 ? `
        <div class="card">
          <div class="card-title mb-4">📰 今日话题精选 (${todayTopicsCount} 篇)</div>
          ${todayTopics.slice(0, 15).map((topic, i) => `
            <div style="background:var(--bg-primary);border-radius:var(--radius);padding:14px 16px;margin-bottom:10px;border-left:3px solid ${i < 3 ? '#f59e0b' : 'var(--border)'}">
              <div class="flex items-center gap-2" style="margin-bottom:6px">
                <span style="color:#f59e0b;font-weight:700">#${i + 1}</span>
                ${topic.user_name ? `<span style="color:var(--text-muted);font-size:12px">${topic.user_name}</span>` : ''}
                ${topic.created_at_str ? `<span style="color:var(--text-muted);font-size:12px">${topic.created_at_str}</span>` : ''}
                ${topic.like_count ? `<span style="color:var(--text-muted);font-size:12px">👍${topic.like_count}</span>` : ''}
                ${topic.reply_count ? `<span style="color:var(--text-muted);font-size:12px">💬${topic.reply_count}</span>` : ''}
              </div>
              <p style="color:var(--text-primary);font-size:14px;font-weight:500;margin:0 0 8px 0">
                ${topic.url ? `<a href="${topic.url}" target="_blank" rel="noopener noreferrer" style="color:var(--accent);text-decoration:none">${topic.title || '查看原文'}</a>` : (topic.title || '无标题')}
              </p>
              ${topic.summary ? `<div style="background:rgba(59,130,246,0.08);border-radius:6px;padding:10px 12px;margin-bottom:8px;border-left:3px solid var(--accent)"><p style="color:var(--accent);font-size:12px;font-weight:600;margin:0 0 4px 0">🤖 AI 摘要</p><p style="color:var(--text-secondary);font-size:13px;margin:0;line-height:1.6">${topic.summary}</p></div>` : ''}
              ${topic.content ? `<div class="topic-content-toggle" id="topic-content-${i}"><div class="topic-content-preview" style="color:var(--text-secondary);font-size:13px;line-height:1.6;max-height:80px;overflow:hidden;position:relative">${topic.content.substring(0, 300)}${topic.content.length > 300 ? '<span class="fade-overlay"></span>' : ''}</div>${topic.content.length > 300 ? `<div class="topic-content-full" style="display:none;color:var(--text-secondary);font-size:13px;line-height:1.6;white-space:pre-wrap">${topic.content}</div><button onclick="toggleTopicContent(${i})" class="toggle-btn" id="topic-btn-${i}">展开全文 ▼</button>` : ''}</div>` : (topic.content_available === false ? `<p style="color:#f59e0b;font-size:12px;margin:0">⚠️ 内容待获取（Playwright不可用）</p>` : '')}
            </div>
          `).join('')}
        </div>
        ` : ''}

        <!-- Top Posts -->
        <div class="card">
          <div class="card-title mb-4">⭐ 重点消息 TOP${Math.min(topPosts.length, 10)}</div>
          ${topPosts.length === 0
            ? '<div class="empty-state"><p>今日无重点消息</p></div>'
            : topPosts.slice(0, 10).map((post, i) => {
              const fullText = post.full_text || post.text || '';
              const previewText = post.summary || (fullText.length > 120 ? fullText.substring(0, 120) + '...' : fullText);
              const needsToggle = fullText.length > 120;
              return `
              <div style="background:var(--bg-primary);border-radius:var(--radius);padding:16px;margin-bottom:12px;border-left:3px solid ${i < 3 ? 'var(--accent)' : 'var(--border)'}">
                <div class="flex items-center gap-2" style="margin-bottom:8px;flex-wrap:wrap">
                  <span style="color:var(--accent);font-weight:700">#${i + 1}</span>
                  <span class="font-bold">${post.user_name || '未知'}</span>
                  ${post.created_at_str ? `<span style="color:var(--text-muted);font-size:12px">${post.created_at_str}</span>` : ''}
                  ${post.category ? `<span class="badge badge-blue">${post.category}</span>` : ''}
                  ${post.sentiment ? `<span class="badge ${post.sentiment === '正面' ? 'badge-green' : post.sentiment === '负面' ? 'badge-red' : 'badge-yellow'}">${post.sentiment}</span>` : ''}
                  ${post.post_type ? `<span class="badge badge-yellow">${post.post_type === 'original' ? '原创' : post.post_type === 'reply' ? '回复' : post.post_type}</span>` : ''}
                  ${post.likes ? `<span style="color:var(--text-muted);font-size:12px">👍${post.likes}</span>` : ''}
                  ${post.comments ? `<span style="color:var(--text-muted);font-size:12px">💬${post.comments}</span>` : ''}
                </div>
                <div id="post-text-${i}" class="post-text-container">
                  <p class="text-sm post-preview" style="color:var(--text-secondary);margin:0;line-height:1.6">${previewText}</p>
                  ${needsToggle ? `<p class="text-sm post-full" style="color:var(--text-secondary);margin:0;line-height:1.6;display:none;white-space:pre-wrap">${fullText}</p>` : ''}
                </div>
                ${needsToggle ? `<button onclick="togglePostContent(${i})" class="toggle-btn" id="post-btn-${i}">展开全文 ▼</button>` : ''}
                ${post.stocks && post.stocks.length > 0 ? `
                  <div style="margin-top:6px">
                    ${post.stocks.map(s => `<span class="badge badge-green" style="margin-left:4px">$${s}$</span>`).join('')}
                  </div>
                ` : ''}
              </div>
            `}).join('')}
        </div>

        <!-- AI Analysis -->
        ${latest.analysis ? `
        <div class="card">
          <div class="card-title mb-4">🤖 AI 综合分析</div>
          <div style="background:var(--bg-primary);border-radius:var(--radius);padding:16px;white-space:pre-wrap;line-height:1.8;color:var(--text-secondary)">${latest.analysis}</div>
        </div>
        ` : ''}

        <!-- Posts AI Summary -->
        ${latest.posts_analysis ? `
        <div class="card">
          <div class="card-title mb-4">📝 重点帖子 AI 汇总</div>
          <div style="background:linear-gradient(135deg, rgba(59,130,246,0.05), rgba(168,85,247,0.05));border-radius:var(--radius);padding:16px;border:1px solid rgba(59,130,246,0.15)">
            <div style="white-space:pre-wrap;line-height:1.8;color:var(--text-secondary);font-size:14px">${latest.posts_analysis}</div>
          </div>
        </div>
        ` : ''}

        <!-- History Timeline -->
        <div class="card">
          <div class="card-title mb-4">历史摘要</div>
          <div class="timeline">
            ${allData.slice(0, 30).map(entry => {
              const d = entry.data;
              return `
                <div class="timeline-item">
                  <div class="timeline-date">${d.date || entry.filename}</div>
                  <div class="timeline-content">
                    <span class="badge badge-blue">${d.active_users || 0} 人活跃</span>
                    <span class="badge badge-green" style="margin-left:4px">${d.filtered_posts || 0} 条有效</span>
                    ${(d.top_posts || []).slice(0, 2).map(p =>
                      `<span style="margin-left:8px;color:var(--text-muted)">${p.user_name}: ${(p.summary || '').slice(0, 30)}...</span>`
                    ).join('')}
                  </div>
                </div>
              `;
            }).join('')}
          </div>
        </div>
      `;

      // Category chart
      if (catEntries.length > 0) {
        const catChart = initChart('categoryChart');
        if (catChart) {
          const theme = getEChartsTheme();
          catChart.setOption({
            ...theme,
            tooltip: { ...theme.tooltip, trigger: 'item' },
            series: [{
              type: 'pie', radius: ['40%', '70%'],
              label: { color: '#94a3b8', formatter: '{b}: {c} ({d}%)' },
              data: catEntries.map(([name, count]) => ({ name, value: count }))
            }]
          });
        }
      }
    }

    // Toggle post content (expand/collapse)
    function togglePostContent(index) {
      const container = document.getElementById(`post-text-${index}`);
      const btn = document.getElementById(`post-btn-${index}`);
      if (!container || !btn) return;
      const preview = container.querySelector('.post-preview');
      const full = container.querySelector('.post-full');
      if (!full) return;
      if (full.style.display === 'none') {
        preview.style.display = 'none';
        full.style.display = 'block';
        btn.textContent = '收起 ▲';
      } else {
        preview.style.display = 'block';
        full.style.display = 'none';
        btn.textContent = '展开全文 ▼';
      }
    }

    // Toggle topic content (expand/collapse)
    function toggleTopicContent(index) {
      const container = document.getElementById(`topic-content-${index}`);
      const btn = document.getElementById(`topic-btn-${index}`);
      if (!container || !btn) return;
      const preview = container.querySelector('.topic-content-preview');
      const full = container.querySelector('.topic-content-full');
      if (!full) return;
      if (full.style.display === 'none') {
        preview.style.display = 'none';
        full.style.display = 'block';
        btn.textContent = '收起 ▲';
      } else {
        preview.style.display = 'block';
        full.style.display = 'none';
        btn.textContent = '展开全文 ▼';
      }
    }
  </script>
</body>
</html>
